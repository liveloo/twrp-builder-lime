name: Build TWRP 3.7.2 (Android 12.1) for Lime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v8
        with:
          root-reserve-mb: 2000
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Workflow Repository
        uses: actions/checkout@v3

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            realpath libxml2-utils xsltproc unzip fontconfig python3 git repo

      - name: Initialize Repo
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "Dylan"
          git config --global user.email "dylan@example.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree (Redmi 9T lime)
        run: |
          cd ~/twrp
          git clone https://github.com/OrangeFox-Devices/device_xiaomi_lime.git device/xiaomi/lime -b main --depth=1

      - name: Build TWRP Recovery Image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_lime-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TWRP_3.7.2_lime_recovery
          path: /home/runner/twrp/out/target/product/lime/recovery.img
